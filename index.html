<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solpet | Puntos de venta</title>
  <meta name="description" content="Encuentra las tiendas y veterinarias de Lima donde están los productos de Solpet.">
  <meta name="theme-color" content="#007A33">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="canonical" href="https://unrecord.github.io/SOLPET/">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- vista previa al compartir el enlace (WhatsApp, Facebook, etc.): las direcciones deben ser completas -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Solpet">
  <meta property="og:locale" content="es_PE">
  <meta property="og:url" content="https://unrecord.github.io/SOLPET/">
  <meta property="og:title" content="Solpet | Encuentra tu punto de venta más cercano">
  <meta property="og:description" content="Tiendas y veterinarias de Lima donde están los productos de Solpet. Busca por distrito, por voz o cerca de ti.">
  <meta property="og:image" content="https://unrecord.github.io/SOLPET/assets/compartir.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo de Solpet y el texto: encuentra tu punto de venta más cercano">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="mapa/base.css">
  <link rel="stylesheet" href="mapa/estilos.css">
  <script src="assets/vendor/maplibre/maplibre-gl.js" defer></script>
  <script src="mapa/tiendas.js" defer></script>
  <script src="mapa/mapa.js" defer></script>
  <script src="mapa/lugares.js" defer></script>
  <script src="mapa/app.js" defer></script>
</head>
<body>
  <main>
    <h1 class="sr-only">Solpet: puntos de venta en Lima</h1>
    <div class="map" id="map" role="region" aria-label="Mapa de puntos de venta en Lima"></div>
  </main>
  <noscript><p class="noscript">Para ver el mapa de puntos de venta, activa JavaScript en tu navegador.</p></noscript>

  <!-- barra superior: logo, buscador (con voz) y "cerca de mí" -->
  <header class="bar">
    <div class="bar__row">
      <img class="bar__logo" src="assets/solpet-logo.webp" alt="Solpet" width="640" height="208">
      <div class="search">
        <label class="sr-only" for="store-q">Buscar por distrito, tienda o calle</label>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <input id="store-q" type="search" placeholder="Distrito, tienda o calle" autocomplete="off" enterkeyhint="search">
        <button class="search__mic" id="voice" type="button" aria-label="Buscar por voz: di tu distrito o zona" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </button>
      </div>
      <button class="btn btn--verde bar__near" id="near-me" type="button" aria-label="Ver los puntos de venta más cercanos a mí">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l7.5 3 3 7.5z"/></svg>
        <span>Cerca de mí</span>
      </button>
    </div>
    <p class="bar__count" id="store-count" aria-live="polite"></p>
  </header>

  <!-- contacto por WhatsApp: el mensaje se arma al tocarlo (con el lugar buscado, si hay uno) -->
  <aside aria-label="Contacto">
  <a class="wsp" id="wsp" href="https://wa.me/51960471967" target="_blank" rel="noopener"
     aria-label="Escríbenos por WhatsApp al 960 471 967 para saber cuál es la tienda más cercana" title="Escríbenos por WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16.04 3C8.86 3 3.02 8.83 3.02 16c0 2.29.6 4.53 1.74 6.5L3 29l6.68-1.75A13 13 0 0 0 16.04 29C23.2 29 29 23.17 29 16S23.2 3 16.04 3Zm0 23.8c-2 0-3.95-.54-5.65-1.55l-.4-.24-3.97 1.04 1.06-3.86-.26-.4A10.77 10.77 0 0 1 5.2 16c0-5.97 4.86-10.82 10.84-10.82 5.97 0 10.8 4.85 10.8 10.82 0 5.96-4.84 10.8-10.8 10.8Zm5.93-8.1c-.33-.16-1.93-.95-2.23-1.06-.3-.11-.52-.16-.73.16-.22.33-.84 1.06-1.03 1.27-.19.22-.38.25-.7.08-.33-.16-1.38-.5-2.62-1.6-.97-.87-1.62-1.93-1.81-2.26-.19-.32-.02-.5.14-.66.15-.15.33-.38.49-.57.16-.19.22-.33.33-.54.1-.22.05-.41-.03-.57-.08-.16-.73-1.76-1-2.41-.27-.63-.54-.55-.73-.56h-.62c-.22 0-.57.08-.87.41-.3.32-1.14 1.11-1.14 2.71s1.17 3.15 1.33 3.36c.16.22 2.3 3.5 5.56 4.91.78.34 1.39.54 1.86.69.78.25 1.49.21 2.05.13.63-.09 1.93-.79 2.2-1.55.27-.76.27-1.41.19-1.55-.08-.13-.3-.21-.62-.37Z"/></svg>
  </a>
  </aside>

  <!-- avisos breves en el celular (ubicación, búsqueda por voz, tienda más cercana) -->
  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <!-- tarjetas que se deslizan; cada una corresponde a un pin -->
  <section class="deck" aria-label="Puntos de venta">
    <div class="deck__actions">
      <button class="btn deck__list-btn" id="open-list" type="button" aria-expanded="false" aria-controls="sheet">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor"/></svg>
        <span>Ver lista</span>
      </button>
      <button class="deck__min" id="toggle-deck" type="button" aria-expanded="true" aria-controls="deck" aria-label="Ocultar las tiendas para ver más mapa">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 5 6 6 6-6" stroke="var(--verde)"/><path d="m6 12 6 6 6-6" stroke="var(--amarillo)"/></svg>
      </button>
    </div>
    <button class="deck__nav deck__nav--prev" type="button" data-dir="-1" aria-label="Tienda anterior"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <ul class="deck__track" id="deck"></ul>
    <button class="deck__nav deck__nav--next" type="button" data-dir="1" aria-label="Tienda siguiente"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
  </section>

  <!-- lista completa por distrito -->
  <aside class="sheet" id="sheet" aria-labelledby="t-lista" inert>
    <div class="sheet__head">
      <span class="sheet__grip" aria-hidden="true"></span>
      <h2 class="sheet__title" id="t-lista">Encuéntranos en</h2>
      <button class="sheet__close" id="close-list" type="button" aria-label="Cerrar la lista y volver al mapa">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet__list" id="store-list"></div>
  </aside>
</body>
</html>
