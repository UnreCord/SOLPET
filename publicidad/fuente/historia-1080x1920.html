<!doctype html>
<html lang="es" data-digital="1080x1920">
<head>
<meta charset="utf-8">
<title>Historia 1080 × 1920 · Mapa de puntos de venta Solpet</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=block" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<style>
  /* Instagram y WhatsApp tapan ~14 % arriba y ~18 % abajo: lo importante va en el centro */
  .logo { position: absolute; left: 50%; transform: translateX(-50%); top: 22rem; width: 40rem; }
  .titular { position: absolute; left: 7rem; right: 7rem; top: 38rem; font-size: 10rem; text-align: center; }
  .panel { left: 0; right: 0; top: 68rem; bottom: 0; background: var(--verde); overflow: hidden; }
  .celular { left: 7rem; top: 62rem; width: 38rem; }
  .qr { left: 53rem; top: 78rem; width: 39rem; padding: 2.6rem; }
  .qr__cta { top: -2.6rem; font-size: 3rem; padding: 1rem 3rem; }
  .pasos { position: absolute; left: 53rem; right: 6rem; top: 122rem; gap: 2.2rem; color: var(--blanco); }
  .pasos li { gap: 1.8rem; }
  .pasos b { width: 5rem; height: 5rem; font-size: 2.7rem; }
  .pasos span { font-size: 2.8rem; }
  .web { position: absolute; left: 53rem; top: 145.5rem; font-size: 2.9rem; color: var(--amarillo); }
  .banda { left: 0; right: 0; bottom: 0; height: 2.4rem; background: var(--amarillo); }
</style>
</head>
<body>
<div class="pieza">
  <img class="logo" src="../../assets/solpet-logo.svg" alt="Solpet">
  <h1 class="titular">Encuentra tu punto de venta más cercano</h1>
  <div class="sangra panel">
    <div class="halo" style="width:80rem;height:80rem;left:-25rem;top:10rem"></div>
    <div class="halo" style="width:55rem;height:55rem;left:-12rem;top:22rem"></div>
    <img class="pin" src="../../assets/pin.svg" style="width:6rem;left:88rem;top:4rem;transform:rotate(8deg)">
  </div>
  <div class="sangra banda"></div>
  <div class="celular"><img src="app-celular.jpg" alt=""></div>
  <div class="qr">
    <span class="qr__cta">Escanéame</span>
    <img src="../../qr/qr-mapa-solpet.svg" alt="Código QR del mapa de puntos de venta">
  </div>
  <ol class="pasos">
    <li><b>1</b><span>Entra al enlace o escanea</span></li>
    <li><b>2</b><span>Busca tu distrito o dilo por voz</span></li>
    <li><b>3</b><span>Toca «Cómo llegar»</span></li>
  </ol>
  <p class="web">unrecord.github.io/SOLPET</p>
</div>
</body>
</html>
