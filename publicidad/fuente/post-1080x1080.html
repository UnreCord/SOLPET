<!doctype html>
<html lang="es" data-digital="1080x1080">
<head>
<meta charset="utf-8">
<title>Post 1080 × 1080 · Mapa de puntos de venta Solpet</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=block" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<style>
  .logo { position: absolute; left: 7rem; top: 7rem; width: 27rem; }
  .titular { position: absolute; left: 7rem; top: 19rem; width: 47rem; font-size: 7.6rem; }
  .sub { position: absolute; left: 7rem; top: 45rem; width: 42rem; font-size: 2.5rem; line-height: 1.35; }
  .qr { left: 7rem; top: 60rem; width: 25rem; padding: 1.7rem; }
  .qr__cta { top: -2rem; font-size: 2.1rem; padding: .7rem 2.2rem; }
  .web { position: absolute; left: 7rem; top: 89rem; font-size: 2.5rem; color: var(--verde-900); }
  .panel { left: 58rem; right: 0; top: 0; bottom: 0; background: var(--verde); overflow: hidden; }
  .celular { left: 56rem; top: 8rem; width: 37rem; }
  .banda { left: 58rem; right: 0; bottom: 0; height: 2.2rem; background: var(--amarillo); }
</style>
</head>
<body>
<div class="pieza">
  <img class="logo" src="../../assets/solpet-logo.svg" alt="Solpet">
  <h1 class="titular">Encuentra tu punto de venta más cercano</h1>
  <p class="sub">Tiendas y veterinarias de Lima. Busca por distrito, por voz o cerca de ti.</p>
  <div class="qr">
    <span class="qr__cta">Escanéame</span>
    <img src="../../qr/qr-mapa-solpet.svg" alt="Código QR del mapa de puntos de venta">
  </div>
  <p class="web">unrecord.github.io/SOLPET</p>
  <div class="sangra panel">
    <div class="halo" style="width:60rem;height:60rem;left:-10rem;top:20rem"></div>
    <div class="halo" style="width:40rem;height:40rem;left:0rem;top:30rem"></div>
  </div>
  <div class="sangra banda"></div>
  <div class="celular"><img src="app-celular.jpg" alt=""></div>
</div>

</html>
