<!doctype html>
<html lang="es" data-impresion="850x2000" data-vista="680">
<head>
<meta charset="utf-8">
<title>Roll-up 85 × 200 cm · Mapa de puntos de venta Solpet</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=block" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<style>
  /* 100rem = 85 cm. El QR queda a la altura del pecho (su centro a ~1,05 m del piso) y los últimos 12 cm
     quedan libres: en muchos roll-up la base los tapa. */
  .logo { position: absolute; left: 50%; transform: translateX(-50%); top: 9rem; width: 60rem; }
  .etiqueta { position: absolute; left: 50%; transform: translateX(-50%); top: 32rem; font-size: 2.7rem; padding: 1.1rem 3.2rem; white-space: nowrap; }
  .titular { position: absolute; left: 6rem; right: 6rem; top: 40rem; font-size: 11.4rem; text-align: center; }
  .panel { left: calc(-1 * var(--b)); right: calc(-1 * var(--b)); top: 80rem; bottom: calc(-1 * var(--b)); background: var(--verde); overflow: hidden; }
  .banda { left: calc(-1 * var(--b)); right: calc(-1 * var(--b)); bottom: calc(-1 * var(--b)); height: calc(14rem + var(--b)); background: var(--amarillo); }
  .qr { left: 50%; transform: translateX(-50%); top: 87rem; width: 54rem; padding: 3.4rem; }
  .qr__cta { top: -3.4rem; font-size: 4rem; padding: 1.4rem 4.4rem; }
  .bajo-qr { position: absolute; left: 0; right: 0; top: 145rem; text-align: center; color: var(--blanco); font-size: 3.6rem; font-weight: 600; }
  .celular { left: 7rem; top: 154rem; width: 31rem; }
  .pasos { position: absolute; left: 43rem; right: 6rem; top: 160rem; gap: 3.6rem; color: var(--blanco); }
  .pasos li { gap: 2.6rem; }
  .pasos b { width: 6.4rem; height: 6.4rem; font-size: 3.4rem; }
  .pasos span { font-size: 3.4rem; }
  .web { position: absolute; left: 43rem; top: 205rem; font-size: 3.4rem; color: var(--amarillo); }
  .base { position: absolute; left: 0; right: 0; bottom: 4.4rem; text-align: center; font-size: 3.4rem; font-weight: 700; color: var(--verde-900); }
</style>
</head>
<body>
<div class="pieza">
  <img class="logo" src="../../assets/solpet-logo.svg" alt="Solpet">
  <span class="etiqueta">Mapa de puntos de venta</span>
  <h1 class="titular">Encuentra tu punto de venta más cercano</h1>

  <div class="sangra panel">
    <div class="halo" style="width:90rem;height:90rem;left:-30rem;top:60rem"></div>
    <div class="halo" style="width:60rem;height:60rem;left:-15rem;top:75rem"></div>
    <div class="halo" style="width:70rem;height:70rem;left:60rem;top:-20rem"></div>
    <img class="pin" src="../../assets/pin.svg" style="width:8rem;left:6rem;top:12rem;transform:rotate(-8deg)">
    <img class="pin" src="../../assets/pin.svg" style="width:6.5rem;left:85rem;top:40rem;transform:rotate(6deg)">
  </div>
  <div class="sangra banda"></div>

  <div class="qr">
    <span class="qr__cta">Escanéame</span>
    <img src="../../qr/qr-mapa-solpet.svg" alt="Código QR del mapa de puntos de venta">
  </div>
  <p class="bajo-qr">Con la cámara de tu celular</p>

  <div class="celular"><img src="app-celular.jpg" alt=""></div>
  <ol class="pasos">
    <li><b>1</b><span>Escanea el código</span></li>
    <li><b>2</b><span>Busca tu distrito, dilo por voz o toca «Cerca de mí»</span></li>
    <li><b>3</b><span>Toca «Cómo llegar» y ve con Google Maps</span></li>
  </ol>
  <p class="web">unrecord.github.io/SOLPET</p>
  <p class="base">Tiendas y veterinarias en todo Lima</p>
</div>
</body>
</html>
